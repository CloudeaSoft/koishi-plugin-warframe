name: Build and Test
permissions:
  contents: read

on:
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows the Release workflow to reuse this job on push to master
  workflow_call:

# Keep builds isolated per pull request or branch. A newer commit on the same
# pull request/branch supersedes its older build without affecting other PRs.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
      - name: Setup Yarn
        uses: ./.github/actions/setup-yarn
      - name: Install
        run: yarn install --no-immutable
      - name: Build
        run: yarn build
      - name: Type
        run: yarn dtsc
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
